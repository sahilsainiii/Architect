<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Architect">
<meta name="theme-color" content="#0D0D0F">
<title>The Architect</title>
<!-- Fully offline - no external dependencies -->
<style>
:root{
  --bg:#0D0D0F;--bg2:#141418;--bg3:#1A1A20;--surface:#1E1E25;--surface2:#262630;--surface3:#2E2E3A;
  --gold:#C9A55C;--gold2:#E4C47A;--gold3:#F5D98A;--gold-dim:rgba(201,165,92,0.12);--gold-dim2:rgba(201,165,92,0.06);
  --ember:#E07858;--ember-dim:rgba(224,120,88,0.12);--sage:#6BAF8D;--azure:#5B8EC9;--violet:#9B7FD0;--rose:#C46A7A;
  --text:#E8E4DC;--text2:#A8A4A0;--text3:#706C68;--text4:#504C48;
  --border:rgba(201,165,92,0.08);--border2:rgba(201,165,92,0.14);--border3:rgba(201,165,92,0.22);
  --glow:0 0 30px rgba(201,165,92,0.08);--shadow:0 4px 24px rgba(0,0,0,0.3);--shadow2:0 8px 40px rgba(0,0,0,0.4);
  --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,'Helvetica Neue',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--nav-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
body::before{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

.topbar{padding:calc(var(--safe-top)+12px) 20px 12px;background:linear-gradient(180deg,var(--bg2),transparent);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 12px rgba(201,165,92,0.25)}
.topbar-title{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--text);letter-spacing:0.02em}
.topbar-sub{font-size:10px;color:var(--text3);margin-top:1px;letter-spacing:0.06em;text-transform:uppercase}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.icon-btn:active{transform:scale(.92);background:var(--surface2)}
.icon-btn svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.pages{flex:1;overflow:hidden;position:relative;z-index:1}
.page{position:absolute;inset:0;overflow-y:auto;padding:8px 16px calc(var(--nav-h)+var(--safe-bot)+20px);opacity:0;pointer-events:none;transform:translateY(6px);transition:all .3s cubic-bezier(.25,.46,.45,.94);-webkit-overflow-scrolling:touch}
.page.active{opacity:1;pointer-events:all;transform:translateY(0)}
.page::-webkit-scrollbar{display:none}

.nav{display:flex;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;padding-bottom:var(--safe-bot);position:relative;z-index:10}
.nav-btn{flex:1;padding:10px 4px 8px;background:none;border:none;color:var(--text4);font-family:var(--sans);font-size:9px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .25s;position:relative}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--gold)}
.nav-btn.active::after{content:'';position:absolute;top:-1px;left:25%;right:25%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:1px}

.hero{background:linear-gradient(145deg,var(--surface) 0%,var(--bg3) 100%);border:1px solid var(--border2);border-radius:20px;padding:24px 20px 20px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--glow)}
.hero::before{content:'';position:absolute;top:-60px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(201,165,92,0.08) 0%,transparent 70%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.hero-mantra{font-size:9px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.hero-level{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--text);line-height:1.1}
.hero-sublevel{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.4}
.hero-xp-badge{background:linear-gradient(135deg,rgba(201,165,92,0.15),rgba(201,165,92,0.05));border:1px solid var(--border3);border-radius:12px;padding:8px 14px;text-align:center;flex-shrink:0}
.hero-xp-num{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--gold2)}
.hero-xp-lbl{font-size:8px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.xp-row{display:flex;justify-content:space-between;margin-bottom:6px}
.xp-label{font-size:10px;color:var(--text3)}
.xp-val{font-size:10px;color:var(--gold);font-weight:700}
.xp-track{height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width .8s cubic-bezier(.25,.46,.45,.94)}
.stats-row{display:flex;gap:8px;margin-top:16px}
.stat-chip{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat-num{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:8px;color:var(--text3);margin-top:2px;letter-spacing:.08em;text-transform:uppercase}

.streak-cal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:18px}
.streak-cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.streak-cal-title{font-size:9px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.streak-fire{font-size:11px;color:var(--gold);font-weight:700}
.streak-grid{display:flex;gap:4px;justify-content:space-between}
.streak-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.streak-dot{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text4);background:var(--bg);border:1px solid var(--border);transition:all .3s}
.streak-dot.filled{background:linear-gradient(135deg,var(--gold-dim),var(--gold-dim2));border-color:var(--border3);color:var(--gold)}
.streak-dot.today{border-color:var(--gold);box-shadow:0 0 12px rgba(201,165,92,0.2)}
.streak-lbl{font-size:8px;color:var(--text4);text-transform:uppercase;font-weight:600}

.pillar-overview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:18px}
.pillar-chip{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;position:relative;overflow:hidden}
.pillar-bar{position:absolute;bottom:0;left:0;height:2px;border-radius:0 0 10px 10px;transition:width .5s ease}
.pillar-pct{font-family:var(--serif);font-size:18px;font-weight:700}
.pillar-name{font-size:8px;color:var(--text3);margin-top:2px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.freq-tabs{display:flex;gap:6px;margin-bottom:16px}
.ft{padding:7px 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.ft.active{background:var(--gold-dim);border-color:var(--border3);color:var(--gold)}

.cat-section{margin-bottom:14px}
.cat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px}
.cat-name{font-size:11px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--text2);letter-spacing:.04em}
.cat-dot{width:6px;height:6px;border-radius:3px;flex-shrink:0}
.cat-prog{font-size:10px;color:var(--text3);font-weight:600}
.cat-track{height:2px;background:var(--bg);border-radius:1px;overflow:hidden;margin-bottom:8px}
.cat-fill{height:100%;border-radius:1px;transition:width .5s ease}

.habit-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:6px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.habit-accent{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0}
.habit-item:active{transform:scale(.985)}
.habit-item.done{opacity:.4}
.habit-item.done .habit-name{text-decoration:line-through;text-decoration-color:var(--text4)}
.habit-item.completing{animation:cFlash .5s ease}
@keyframes cFlash{0%{background:var(--surface)}30%{background:rgba(201,165,92,0.1)}100%{background:var(--surface)}}
.habit-check{width:24px;height:24px;border-radius:8px;border:2px solid var(--border3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .25s;background:transparent}
.habit-check.on{border-color:transparent;box-shadow:0 2px 10px rgba(201,165,92,0.25)}
.habit-check svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
.habit-check.on svg{opacity:1}
.habit-info{flex:1;min-width:0}
.habit-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.habit-sub{font-size:10px;color:var(--text3);margin-top:2px}
.habit-xp{font-size:11px;font-weight:700;color:var(--text3);flex-shrink:0}
.habit-edit{width:28px;height:28px;border-radius:8px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;flex-shrink:0}
.habit-item:hover .habit-edit,.habit-item:active .habit-edit{opacity:.6}
.habit-edit svg{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty-state{text-align:center;padding:48px 20px;color:var(--text3);font-size:13px}
.empty-state span{color:var(--gold);font-weight:700}

.review-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:16px}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.rc-num{font-family:var(--serif);font-size:28px;font-weight:700}
.rc-lbl{font-size:9px;color:var(--text3);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.week-section{margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.week-section h3{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px;font-weight:700}
.days-row{display:flex;gap:6px}
.day-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.day-bar-wrap{height:60px;display:flex;align-items:flex-end;width:100%}
.day-bar{width:100%;border-radius:4px 4px 0 0;transition:height .6s ease}
.day-lbl{font-size:8px;color:var(--text4);font-weight:700;text-transform:uppercase}

.pillar-breakdown{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.pillar-breakdown h3{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px;font-weight:700}
.pb-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pb-label{font-size:11px;color:var(--text2);width:80px;flex-shrink:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-track{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.pb-fill{height:100%;border-radius:3px;transition:width .6s ease}
.pb-pct{font-size:11px;font-weight:700;width:34px;text-align:right;flex-shrink:0}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg3);border-radius:20px 20px 0 0;border:1px solid var(--border2);border-bottom:none;padding:24px 20px calc(28px + var(--safe-bot));width:100%;max-width:480px;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.25,.46,.45,.94)}
.overlay.open .modal{transform:translateY(0)}
.modal-handle{width:36px;height:3px;border-radius:2px;background:var(--surface3);margin:0 auto 20px}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;display:block;font-weight:700}
.form-input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;-webkit-appearance:none}
.form-input:focus{border-color:var(--gold)}
.form-select{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;-webkit-appearance:none;cursor:pointer}
.form-select option{background:var(--bg3);color:var(--text)}
.freq-pills{display:flex;gap:6px}
.freq-pill{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s}
.freq-pill.active{background:var(--gold-dim);border-color:var(--border3);color:var(--gold)}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:transform .15s;border:3px solid transparent}
.color-swatch.sel{transform:scale(1.15);border-color:var(--text)}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-primary{flex:1;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;color:var(--bg);font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer}
.btn-primary:active{opacity:.85}
.btn-secondary{padding:13px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--border2);color:var(--text3);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
.btn-danger{padding:13px 16px;border-radius:12px;background:var(--ember-dim);border:1px solid rgba(224,120,88,0.2);color:var(--ember);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}

.toast{position:fixed;top:calc(var(--safe-top)+70px);left:50%;transform:translateX(-50%) translateY(-10px);background:var(--surface2);border:1px solid var(--border3);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--gold);opacity:0;transition:all .25s;z-index:200;white-space:nowrap;box-shadow:var(--shadow2);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.xp-popup{position:fixed;pointer-events:none;z-index:300;font-family:var(--serif);font-size:20px;font-weight:700;color:var(--gold2);text-shadow:0 0 12px rgba(201,165,92,0.5);animation:xpFloat 1s ease forwards}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.2)}}
.reset-section{margin-top:20px;text-align:center;padding-bottom:20px}
.reset-btn{padding:10px 24px;border-radius:10px;background:transparent;border:1px solid rgba(224,120,88,0.15);color:var(--text4);font-family:var(--sans);font-size:11px;cursor:pointer;transition:all .2s}
.reset-btn:active{border-color:rgba(224,120,88,0.3);color:var(--ember)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-icon">⚔</div>
    <div><div class="topbar-title" id="topbar-title">The Architect</div><div class="topbar-sub" id="topbar-sub">Daily Discipline System</div></div>
  </div>
  <div id="add-btn" class="icon-btn" onclick="openAddModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
</div>

<div class="pages">
  <div class="page active" id="page-dash">
    <div class="hero">
      <div class="hero-top">
        <div><div class="hero-mantra">✦ Your Sadhana ✦</div><div class="hero-level" id="h-level">Level 1 — Beginner</div><div class="hero-sublevel" id="h-sub">Every journey begins with a single step.</div></div>
        <div class="hero-xp-badge"><div class="hero-xp-num" id="h-xp-num">0</div><div class="hero-xp-lbl">Total XP</div></div>
      </div>
      <div class="xp-row"><span class="xp-label">Next level</span><span class="xp-val" id="h-xpval">0 / 100 XP</span></div>
      <div class="xp-track"><div class="xp-fill" id="h-xpfill" style="width:0%"></div></div>
      <div class="stats-row">
        <div class="stat-chip"><div class="stat-num" id="h-streak">0</div><div class="stat-lbl">Streak</div></div>
        <div class="stat-chip"><div class="stat-num" id="h-done">0%</div><div class="stat-lbl">Today</div></div>
        <div class="stat-chip"><div class="stat-num" id="h-count">0</div><div class="stat-lbl">Done</div></div>
      </div>
    </div>
    <div id="streak-cal"></div>
    <div id="pillar-overview"></div>
    <div class="freq-tabs">
      <button class="ft active" id="ft-daily" onclick="setFreq('daily')">Daily</button>
      <button class="ft" id="ft-weekly" onclick="setFreq('weekly')">Weekly</button>
      <button class="ft" id="ft-monthly" onclick="setFreq('monthly')">Monthly</button>
    </div>
    <div id="dash-habits"></div>
  </div>

  <div class="page" id="page-review">
    <div class="review-title">Weekly Review</div>
    <div class="review-grid">
      <div class="review-card"><div class="rc-num" id="r-xp" style="color:var(--gold)">0</div><div class="rc-lbl">XP This Week</div></div>
      <div class="review-card"><div class="rc-num" id="r-streak" style="color:var(--sage)">0</div><div class="rc-lbl">Day Streak</div></div>
      <div class="review-card"><div class="rc-num" id="r-done" style="color:var(--ember)">0</div><div class="rc-lbl">Habits Done</div></div>
      <div class="review-card"><div class="rc-num" id="r-rate" style="color:var(--azure)">0%</div><div class="rc-lbl">Completion</div></div>
    </div>
    <div class="week-section"><h3>Daily Activity</h3><div class="days-row" id="week-bars"></div></div>
    <div class="pillar-breakdown"><h3>Pillar Breakdown</h3><div id="pb-content"></div></div>
    <div class="reset-section"><button class="reset-btn" onclick="resetData()">Reset All Data</button></div>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" id="nav-dash" onclick="goTo('dash')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
  <button class="nav-btn" id="nav-review" onclick="goTo('review')"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Review</button>
</nav>

<div class="overlay" id="habit-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Add New Habit</div>
    <div class="form-group"><label class="form-label">Habit Name</label><input class="form-input" id="m-name" placeholder="e.g. 30 min Walk" maxlength="60"></div>
    <div class="form-group"><label class="form-label">Category / Pillar</label><select class="form-select" id="m-cat"></select></div>
    <div class="form-group"><label class="form-label">Frequency</label><div class="freq-pills"><button class="freq-pill active" id="fp-daily" onclick="mFreq='daily';updFP()">Daily</button><button class="freq-pill" id="fp-weekly" onclick="mFreq='weekly';updFP()">Weekly</button><button class="freq-pill" id="fp-monthly" onclick="mFreq='monthly';updFP()">Monthly</button></div></div>
    <div class="form-group"><label class="form-label">Time (optional)</label><input class="form-input" id="m-time" placeholder="e.g. 7:00 AM" maxlength="20"></div>
    <div class="form-group"><label class="form-label">XP Reward</label><select class="form-select" id="m-xp"><option value="5">5 XP — Easy</option><option value="10" selected>10 XP — Standard</option><option value="15">15 XP — Moderate</option><option value="25">25 XP — Hard</option><option value="50">50 XP — Epic</option></select></div>
    <div class="form-group"><label class="form-label">Color</label><div class="color-row" id="color-row"></div></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const COLORS=['#C9A55C','#E07858','#6BAF8D','#5B8EC9','#9B7FD0','#3ABFA0','#C46A7A','#8B7355','#D4A843'];
const CC={'Spirituality':'#C9A55C','Family':'#E07858','Productivity':'#5B8EC9','Physical Training':'#9B7FD0','Earnings':'#6BAF8D','Long Term':'#8B7355'};
const LVLS=[{n:'Beginner',x:0},{n:'Seeker',x:100},{n:'Practitioner',x:300},{n:'Committed',x:600},{n:'Disciplined',x:1000},{n:'Warrior',x:1600},{n:'Master',x:2400},{n:'Champion',x:3500},{n:'Legend',x:5000},{n:'Enlightened',x:7000}];
const LSUBS=['Every journey begins with a single step.','The seed of discipline has been planted.','You are building something real.','Your identity is beginning to shift.','Others notice. You are different now.','You train when others sleep.','Discipline has become your nature.','You inspire without trying.','Few ever reach here. Press on.','You became who you always wanted to be.'];
const DH=[
  {id:'s1',name:'Morning Meditation',cat:'Spirituality',freq:'daily',xp:10,time:'6:00 AM',col:'#C9A55C'},
  {id:'s2',name:'Evening Meditation',cat:'Spirituality',freq:'daily',xp:10,time:'5:00 PM',col:'#C9A55C'},
  {id:'s3',name:'Shiv Abhishek',cat:'Spirituality',freq:'daily',xp:10,time:'8:00 AM',col:'#C9A55C'},
  {id:'f1',name:'Mother, Father, Sister',cat:'Family',freq:'daily',xp:10,col:'#E07858'},
  {id:'f2',name:'Wife and Kids',cat:'Family',freq:'daily',xp:10,col:'#E07858'},
  {id:'p1',name:'5 Pages — Work Book',cat:'Productivity',freq:'daily',xp:10,col:'#5B8EC9'},
  {id:'p2',name:'5 Pages — Spiritual Book',cat:'Productivity',freq:'daily',xp:10,col:'#5B8EC9'},
  {id:'pt1',name:'50 Pushups',cat:'Physical Training',freq:'daily',xp:10,col:'#9B7FD0'},
  {id:'pt2',name:'20 Situps',cat:'Physical Training',freq:'daily',xp:10,col:'#9B7FD0'},
  {id:'pt3',name:'10 min Anulomvilom',cat:'Physical Training',freq:'daily',xp:10,col:'#9B7FD0'},
  {id:'pt4',name:'Energy Exercises 1',cat:'Physical Training',freq:'daily',xp:10,col:'#9B7FD0'},
  {id:'pt5',name:'Energy Exercises 2',cat:'Physical Training',freq:'daily',xp:10,col:'#9B7FD0'},
  {id:'pt6',name:'15 Min Stretch',cat:'Physical Training',freq:'daily',xp:10,col:'#9B7FD0'},
  {id:'pt7',name:'5000 Steps',cat:'Physical Training',freq:'daily',xp:10,col:'#9B7FD0'},
  {id:'e1',name:'Trading / Backtesting',cat:'Earnings',freq:'daily',xp:10,time:'8:30 AM',col:'#6BAF8D'},
  {id:'e2',name:'YouTube Monday Video',cat:'Earnings',freq:'weekly',xp:25,col:'#6BAF8D'},
  {id:'e3',name:'YouTube Wednesday Video',cat:'Earnings',freq:'weekly',xp:25,col:'#6BAF8D'},
  {id:'e4',name:'Telegram Community Post',cat:'Earnings',freq:'weekly',xp:25,col:'#6BAF8D'},
  {id:'e5',name:'X Community Post',cat:'Earnings',freq:'weekly',xp:25,col:'#6BAF8D'},
  {id:'e6',name:'LinkedIn Post',cat:'Earnings',freq:'weekly',xp:25,col:'#6BAF8D'},
  {id:'e7',name:'Courses & Training',cat:'Earnings',freq:'weekly',xp:25,col:'#6BAF8D'},
  {id:'lt1',name:'Family Investment',cat:'Long Term',freq:'monthly',xp:50,col:'#8B7355'},
  {id:'lt2',name:'Surrounding',cat:'Long Term',freq:'monthly',xp:50,col:'#8B7355'},
  {id:'lt3',name:'Donation',cat:'Long Term',freq:'monthly',xp:50,col:'#8B7355'},
  {id:'lt4',name:'Friends',cat:'Long Term',freq:'monthly',xp:50,col:'#8B7355'}
];
const DCATS=['Spirituality','Family','Productivity','Physical Training','Earnings','Long Term'];

let S={totalXP:0,streak:0,lastDate:'',completions:{},habits:[],cats:[]};
let dashFreq='daily',editId=null,mFreq='daily',mCol=COLORS[0];
const TODAY=new Date().toISOString().split('T')[0];
const WKEY=(()=>{const d=new Date(),y=d.getDay(),f=d.getDate()-y+(y===0?-6:1),m=new Date(d);m.setDate(f);return m.toISOString().split('T')[0]})();
const MKEY=TODAY.slice(0,7);

function gk(f){return f==='daily'?TODAY:f==='weekly'?WKEY:MKEY}
function isDone(id,f){return(S.completions[gk(f)]||[]).includes(id)}
function uid(){return'h'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}
function getLvl(xp){let l=0;for(let i=0;i<LVLS.length;i++)if(xp>=LVLS[i].x)l=i;const c=LVLS[l],n=LVLS[Math.min(l+1,LVLS.length-1)];const p=n.x>c.x?Math.round((xp-c.x)/(n.x-c.x)*100):100;return{num:l+1,name:c.n,sub:LSUBS[l],pct:p,xpIn:xp-c.x,xpFor:n.x>c.x?n.x-c.x:0}}

// Persistence
const SK='architect-v4';
async function save(){
  const d={totalXP:S.totalXP,streak:S.streak,lastDate:S.lastDate,completions:S.completions,habits:S.habits,cats:S.cats};
  try{if(window.storage&&window.storage.set)await window.storage.set(SK,JSON.stringify(d))}catch(e){}
  window._ab=d;
}
async function load(){
  let d=null;
  try{if(window.storage&&window.storage.get){const r=await window.storage.get(SK);if(r&&r.value)d=JSON.parse(r.value)}}catch(e){}
  if(!d&&window._ab)d=window._ab;
  if(d){S.habits=d.habits||JSON.parse(JSON.stringify(DH));S.cats=d.cats||[...DCATS];S.totalXP=d.totalXP||0;S.streak=d.streak||0;S.lastDate=d.lastDate||'';S.completions=d.completions||{}}
  else{S.habits=JSON.parse(JSON.stringify(DH));S.cats=[...DCATS]}
  S.habits.forEach(h=>{if(!S.cats.includes(h.cat))S.cats.push(h.cat)});
  renderAll();
}
function resetData(){if(!confirm('Reset ALL data? Cannot undo.'))return;S={totalXP:0,streak:0,lastDate:'',completions:{},habits:JSON.parse(JSON.stringify(DH)),cats:[...DCATS]};save();renderAll();showToast('Data reset')}

// Rendering
function renderAll(){renderHero();renderStreak();renderPillars();renderDash()}
function renderHero(){
  const l=getLvl(S.totalXP);
  document.getElementById('h-level').textContent=`Level ${l.num} — ${l.name}`;
  document.getElementById('h-sub').textContent=l.sub;
  document.getElementById('h-xp-num').textContent=S.totalXP;
  document.getElementById('h-xpfill').style.width=l.pct+'%';
  document.getElementById('h-xpval').textContent=l.xpFor?`${l.xpIn} / ${l.xpFor} XP`:'MAX';
  document.getElementById('h-streak').textContent=S.streak;
  const dh=S.habits.filter(h=>h.freq==='daily'),dc=dh.filter(h=>isDone(h.id,'daily')).length;
  document.getElementById('h-done').textContent=dh.length?Math.round(dc/dh.length*100)+'%':'0%';
  document.getElementById('h-count').textContent=dc+'/'+dh.length;
}
function renderStreak(){
  const el=document.getElementById('streak-cal'),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const d=new Date(),dow=d.getDay(),mo=dow===0?-6:1-dow;
  let h=`<div class="streak-cal"><div class="streak-cal-header"><div class="streak-cal-title">This Week</div><div class="streak-fire">${S.streak>0?'🔥 '+S.streak+' days':''}</div></div><div class="streak-grid">`;
  for(let i=0;i<7;i++){const dd=new Date();dd.setDate(d.getDate()+mo+i);const dk=dd.toISOString().split('T')[0],c=(S.completions[dk]||[]).length,t=dk===TODAY,fu=dd>new Date()&&!t;h+=`<div class="streak-day"><div class="streak-dot${c?' filled':''}${t?' today':''}" style="${fu?'opacity:.3':''}">${c||dd.getDate()}</div><div class="streak-lbl" style="${t?'color:var(--gold)':''}">${days[i]}</div></div>`}
  h+='</div></div>';el.innerHTML=h;
}
function renderPillars(){
  const el=document.getElementById('pillar-overview'),dh=S.habits.filter(h=>h.freq==='daily'),cats=[...new Set(dh.map(h=>h.cat))];
  if(!cats.length){el.innerHTML='';return}
  let h='<div class="pillar-overview">';
  cats.forEach(c=>{const hs=dh.filter(x=>x.cat===c),dc=hs.filter(x=>isDone(x.id,'daily')).length,p=hs.length?Math.round(dc/hs.length*100):0,col=CC[c]||'#888';h+=`<div class="pillar-chip"><div class="pillar-bar" style="width:${p}%;background:${col};opacity:.4"></div><div class="pillar-pct" style="color:${col}">${p}%</div><div class="pillar-name">${c}</div></div>`});
  h+='</div>';el.innerHTML=h;
}
function renderDash(){
  const f=dashFreq,habits=S.habits.filter(h=>h.freq===f),cats=[...new Set(habits.map(h=>h.cat))];
  let html='';
  if(!habits.length){html=`<div class="empty-state">No ${f} habits yet.<br><br>Tap <span>+</span> to add one.</div>`}
  else cats.forEach(cat=>{
    const hs=habits.filter(h=>h.cat===cat),dc=hs.filter(h=>isDone(h.id,f)).length,p=hs.length?Math.round(dc/hs.length*100):0,col=CC[cat]||hs[0]?.col||'#888';
    html+=`<div class="cat-section"><div class="cat-header"><div class="cat-name"><span class="cat-dot" style="background:${col}"></span>${cat}</div><span class="cat-prog">${dc}/${hs.length}</span></div><div class="cat-track"><div class="cat-fill" style="width:${p}%;background:${col}"></div></div>`;
    hs.forEach(h=>{const dn=isDone(h.id,f);html+=`<div class="habit-item${dn?' done':''}" id="hi_${h.id}"><div class="habit-accent" style="background:${h.col};opacity:${dn?.3:.6}"></div><div class="habit-check${dn?' on':''}" style="${dn?'background:'+h.col+';':''}" onclick="toggle('${h.id}','${f}',event)"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="habit-info" onclick="toggle('${h.id}','${f}',event)"><div class="habit-name">${h.name}</div>${h.time?`<div class="habit-sub">⏰ ${h.time}</div>`:''}</div><div class="habit-xp" style="color:${h.col}" onclick="toggle('${h.id}','${f}',event)">+${h.xp}</div><button class="habit-edit" onclick="openEditModal('${h.id}')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div>`});
    html+='</div>';
  });
  document.getElementById('dash-habits').innerHTML=html;
}

function showXPPopup(x,y,xp){const el=document.createElement('div');el.className='xp-popup';el.textContent=`+${xp} XP`;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}

function toggle(id,freq,ev){
  const h=S.habits.find(x=>x.id===id);if(!h)return;
  const k=gk(freq);if(!S.completions[k])S.completions[k]=[];
  if(isDone(id,freq)){S.completions[k]=S.completions[k].filter(x=>x!==id);S.totalXP=Math.max(0,S.totalXP-h.xp)}
  else{S.completions[k].push(id);S.totalXP+=h.xp;
    if(freq==='daily'&&S.lastDate!==TODAY){const yd=new Date();yd.setDate(yd.getDate()-1);S.streak=(S.lastDate===yd.toISOString().split('T')[0])?S.streak+1:1;S.lastDate=TODAY}
    showToast(`+${h.xp} XP ⚡`);if(ev)showXPPopup(ev.clientX,ev.clientY-20,h.xp);
    const el=document.getElementById('hi_'+id);if(el){el.classList.add('completing');setTimeout(()=>el.classList.remove('completing'),600)}
  }
  save();renderAll();
}

function setFreq(f){dashFreq=f;['daily','weekly','monthly'].forEach(x=>document.getElementById('ft-'+x).classList.toggle('active',x===f));renderDash()}

// Modal
function updFP(){['daily','weekly','monthly'].forEach(x=>document.getElementById('fp-'+x).classList.toggle('active',x===mFreq))}
function selColor(c){mCol=c;document.querySelectorAll('.color-swatch').forEach(s=>s.classList.toggle('sel',s.style.backgroundColor===c||s.style.background===c))}
function buildCats(){document.getElementById('m-cat').innerHTML=S.cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
function buildColors(s){document.getElementById('color-row').innerHTML=COLORS.map(c=>`<div class="color-swatch${c===s?' sel':''}" style="background:${c}" onclick="selColor('${c}')"></div>`).join('')}
function closeModal(){document.getElementById('habit-overlay').classList.remove('open')}

function openAddModal(){
  editId=null;mFreq=dashFreq;mCol=COLORS[0];
  document.getElementById('modal-title').textContent='Add New Habit';
  document.getElementById('m-name').value='';document.getElementById('m-time').value='';document.getElementById('m-xp').value='10';
  buildCats();buildColors(mCol);updFP();
  document.getElementById('modal-actions').innerHTML='<button class="btn-secondary" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="saveHabit()">Add Habit</button>';
  document.getElementById('habit-overlay').classList.add('open');
}
function openEditModal(id){
  const h=S.habits.find(x=>x.id===id);if(!h)return;
  editId=id;mFreq=h.freq;mCol=h.col;
  document.getElementById('modal-title').textContent='Edit Habit';
  document.getElementById('m-name').value=h.name;document.getElementById('m-time').value=h.time||'';document.getElementById('m-xp').value=h.xp;
  buildCats();document.getElementById('m-cat').value=h.cat;buildColors(h.col);updFP();
  document.getElementById('modal-actions').innerHTML=`<button class="btn-danger" onclick="deleteHabit('${id}')">Delete</button><button class="btn-secondary" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="saveHabit()">Save</button>`;
  document.getElementById('habit-overlay').classList.add('open');
}
function saveHabit(){
  const name=document.getElementById('m-name').value.trim();if(!name){showToast('Enter a name');return}
  const cat=document.getElementById('m-cat').value,time=document.getElementById('m-time').value.trim(),xp=parseInt(document.getElementById('m-xp').value);
  if(editId){const h=S.habits.find(x=>x.id===editId);if(h){h.name=name;h.cat=cat;h.freq=mFreq;h.xp=xp;h.col=mCol;h.time=time||undefined}showToast('Updated ✓')}
  else{S.habits.push({id:uid(),name,cat,freq:mFreq,xp,col:mCol,time:time||undefined});if(!S.cats.includes(cat))S.cats.push(cat);showToast('Added ⚡')}
  save();closeModal();renderAll();
}
function deleteHabit(id){if(!confirm('Delete this habit?'))return;S.habits=S.habits.filter(h=>h.id!==id);save();closeModal();renderAll();showToast('Removed')}

// Navigation
function goTo(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  document.getElementById('add-btn').style.display=tab==='dash'?'flex':'none';
  document.getElementById('topbar-title').textContent=tab==='dash'?'The Architect':'Weekly Review';
  document.getElementById('topbar-sub').textContent=tab==='dash'?'Daily Discipline System':'Reflect · Learn · Improve';
  if(tab==='review')renderReview();
}

function renderReview(){
  const d=new Date(),dy=d.getDay(),diff=d.getDate()-dy+(dy===0?-6:1);
  let wXP=0,wDone=0;const bars=[];
  for(let i=0;i<7;i++){const dd=new Date();dd.setDate(diff+i);const dk=dd.toISOString().split('T')[0],done=S.completions[dk]||[],c=done.length;wDone+=c;wXP+=S.habits.filter(h=>h.freq==='daily'&&done.includes(h.id)).reduce((a,h)=>a+h.xp,0);bars.push({day:['M','T','W','T','F','S','S'][i],count:c,today:dk===TODAY})}
  document.getElementById('r-xp').textContent=wXP;
  document.getElementById('r-streak').textContent=S.streak;
  document.getElementById('r-done').textContent=wDone;
  const tp=S.habits.filter(h=>h.freq==='daily').length*7;
  document.getElementById('r-rate').textContent=tp?Math.round(wDone/tp*100)+'%':'0%';
  const mx=Math.max(...bars.map(b=>b.count),1);
  document.getElementById('week-bars').innerHTML=bars.map(b=>{const p=Math.round(b.count/mx*100),col=b.count===0?'var(--surface3)':b.count<5?'var(--gold)':'var(--gold2)';return`<div class="day-col"><div class="day-bar-wrap"><div class="day-bar" style="height:${Math.max(p,b.count>0?8:4)}%;background:${col};${b.today?'box-shadow:0 0 8px rgba(201,165,92,0.3);':''}"></div></div><div class="day-lbl" style="${b.today?'color:var(--gold)':''}">${b.day}</div></div>`}).join('');
  // Pillar breakdown
  const dh=S.habits.filter(h=>h.freq==='daily'),cats=[...new Set(dh.map(h=>h.cat))];
  let pb='';
  cats.forEach(cat=>{const hs=dh.filter(h=>h.cat===cat);let cd=0;for(let i=0;i<7;i++){const dd=new Date();dd.setDate(diff+i);cd+=hs.filter(h=>(S.completions[dd.toISOString().split('T')[0]]||[]).includes(h.id)).length}const ct=hs.length*7,p=ct?Math.round(cd/ct*100):0,col=CC[cat]||'#888';pb+=`<div class="pb-row"><div class="pb-label">${cat}</div><div class="pb-track"><div class="pb-fill" style="width:${p}%;background:${col}"></div></div><div class="pb-pct" style="color:${col}">${p}%</div></div>`});
  document.getElementById('pb-content').innerHTML=pb;
}

let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}

load();
</script>
</body>
</html>
